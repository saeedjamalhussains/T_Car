[workspace]
resolver = "2"
members = ["crates/tcar-core", "crates/tcar-cli", "apps/desktop"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/coolaj86/node-tel-carrier"  # the 2014 original this rebuilds

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
